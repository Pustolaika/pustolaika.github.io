<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Мой сайт</title>
  <style>
    body {
      max-width: 1000px;
      margin: 0 auto;
      padding: 24px;
      color: #333;
      background: #fff;
      font: 17px/1.6 sans-serif;
    }

    header {
      padding-bottom: 16px;
      border-bottom: 1px solid #ccc;
    }

    .layout {
      display: grid;
      grid-template-columns: 190px minmax(0, 1fr);
      gap: 40px;
      margin-top: 28px;
    }

    nav a {
      display: block;
      margin-bottom: 10px;
    }

    a { color: #286090; }
    h1, h2 { line-height: 1.25; }

    footer {
      margin-top: 40px;
      padding-top: 12px;
      border-top: 1px solid #ccc;
      color: #666;
      font-size: 14px;
    }

    @media (max-width: 650px) {
      .layout { grid-template-columns: 1fr; gap: 16px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Мой сайт</h1>
    <p>Заметки, материалы и небольшие проекты.</p>
  </header>

  <div class="layout">
    <nav aria-label="Основное меню">
      <a href="index.html">Главная</a>
      <a href="about.html">О проекте</a>
      <a href="materials.html">Материалы</a>
    </nav>

    <main>
      <h2>Главная</h2>
      <p>Привет! Здесь я собираю свои материалы.</p>

      <h2>Что здесь можно найти</h2>
      <ul>
        <li>Статьи и заметки</li>
        <li>Инструкции</li>
        <li>Файлы и полезные ссылки</li>
      </ul>
    </main>
  </div>

  <footer>Мой небольшой сайт</footer>
</body>
</html>
